name: Feature request
description: Suggest an improvement to a backup workflow.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what makes it difficult in the current app.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain how you would like the app to behave.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Example workflow
      description: Give a concrete example of when you would use this feature.
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: Describe how you handle this today, if applicable.
